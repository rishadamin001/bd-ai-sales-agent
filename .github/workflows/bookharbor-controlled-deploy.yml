name: BookHarbor controlled Cloudflare deploy

# Never deploy on push or PR. Only an authorized manual run on main.
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Type the existing Worker name: bookharbor-mis465'
        required: true
        type: string
      database_name:
        description: 'Type the existing D1 name: bookharbor-mis465'
        required: true
        type: string
      migrate_mis:
        description: 'Insert any missing MIS demo titles (never reset existing rows)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bookharbor-controlled-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bookharbor
    steps:
      - name: Check out the approved main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bookharbor/package-lock.json
      - name: Install reproducible dependencies
        run: npm ci
      - name: Run the complete regression test suite
        run: npm test
      - name: Verify authorized Worker, database, and Cloudflare account
        env:
          DEPLOY_WORKER_NAME: ${{ inputs.worker_name }}
          DEPLOY_DATABASE_NAME: ${{ inputs.database_name }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-cloudflare-target.mjs
      - name: Confirm existing remote D1 database ID before any changes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-remote-d1.mjs
      - name: Add missing MIS demo catalogue records (idempotent)
        if: inputs.migrate_mis
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute bookharbor-mis465 --remote --file=migrations/2026-10-27-add-mis-books.sql --yes
      - name: Verify all four MIS titles exist in remote D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-remote-d1.mjs --verify-mis
      - name: Deploy the current BookHarbor Worker (preserving secrets)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Verify public health and catalogue without creating orders
        env:
          BOOKHARBOR_PUBLIC_URL: https://bookharbor-mis465.bookharbor-mis465.workers.dev/
        run: node scripts/check-public-deployment.mjs
