name: BookHarbor CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bookharbor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: BookHarbor tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bookharbor
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Stay on Node 22 while satisfying engines.node >=22.13.
          node-version: '22'
          cache: npm
          cache-dependency-path: bookharbor/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test
